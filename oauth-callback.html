<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Sótano 22 — Conexión Tienda Nube</title>
<style>
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:#0e0c0b; color:#EAE3D8; font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
  .box{ max-width:520px; padding:32px; text-align:center; }
  h1{ font-size:20px; margin:0 0 16px; color:#fff; }
  code{ display:block; background:#1a1715; border:1px solid #333; border-radius:6px;
        padding:16px; font-size:15px; word-break:break-all; color:#fff; margin:16px 0; }
  p{ color:#c9c2b6; font-size:14px; line-height:1.5; }
</style>
</head>
<body>
  <div class="box">
    <h1>Código de autorización</h1>
    <p>Copiá este código y pasáselo a Claude (expira en 5 minutos):</p>
    <code id="code">—</code>
    <p id="empty" style="display:none;">No se encontró ningún código en la URL. Volvé a intentar el link de autorización.</p>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    if (code) {
      document.getElementById('code').textContent = code;
    } else {
      document.getElementById('code').style.display = 'none';
      document.getElementById('empty').style.display = 'block';
    }
  </script>
</body>
</html>
