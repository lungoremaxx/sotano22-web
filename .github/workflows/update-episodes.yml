name: Actualizar Sotaneadas

on:
  schedule:
    # 03:00 y 15:00 UTC = 00:00 y 12:00 hora Argentina (UTC-3), todos los días.
    # GitHub suele demorar los cron un par de horas; con dos corridas diarias
    # una Sotaneada nueva aparece en la web en menos de un día.
    - cron: "0 3,15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar nuevas Sotaneadas
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update-episodes.mjs

      - name: Actualizar suscriptores de YouTube y seguidores de Instagram
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: node scripts/update-stats.mjs

      # Corre aunque falle un paso anterior, para no perder lo que sí se actualizó
      - name: Commitear y pushear si hay cambios
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- episodes.json stats.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "sotano22-bot"
          git config user.email "actions@github.com"
          git add episodes.json stats.json
          git commit -m "Actualiza episodios y stats"
          git push
